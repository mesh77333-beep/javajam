<!DOCTYPE html><html lang="en"><head><title>JavaJam Coffee House - Order</title><meta charset="utf-8"><link rel="stylesheet" href="javajamcss.css"><script>
var prices={"Latte":{"Small":3,"Medium":3.5,"Large":4},"Cappuccino":{"Small":3.5,"Medium":4,"Large":4.5},"Espresso":{"Small":2.5,"Medium":3,"Large":3.5},"Mocha":{"Small":4,"Medium":4.5,"Large":5}};
function calculateTotal(){var c=document.querySelector('input[name="coffeeType"]:checked').value;var s=document.getElementById('size').value;var q=Number(document.getElementById('quantity').value);var t=prices[c][s]*q;if(q>=5)t=t-(t*0.10);document.getElementById('orderTotal').textContent="Total: $"+t.toFixed(1);return t;}
function submitOrder(e){e.preventDefault();var name=document.getElementById('name').value.trim();var c=document.querySelector('input[name="coffeeType"]:checked').value;var s=document.getElementById('size').value;var q=Number(document.getElementById('quantity').value);var t=calculateTotal().toFixed(1);window.location.href="confirmation.html?"+new URLSearchParams({name:name,coffee:c,size:s,quantity:q,total:t}).toString();}
</script></head><body><div id="wrapper"><header><h1>JavaJam Coffee House</h1></header><nav>
            <a href="index.html">Home</a>&nbsp;
            <a href="menu.html">Menu</a>&nbsp;
            <a href="music.html">Music</a>&nbsp;
            <a href="jobs.html">Jobs</a>&nbsp;
            <a href="order.html">Order</a>
        </nav><main><h2>Order Form</h2><form onsubmit="submitOrder(event)"><fieldset><legend>Customer Information</legend><label for="name">Name:</label><input type="text" id="name" name="name" required><br><br><label for="email">Email:</label><input type="email" id="email" name="email" required><br><br><label for="phone">Phone:</label><input type="tel" id="phone" name="phone" required><br><br><label for="address">Address:</label><input type="text" id="address" name="address" list="addressList"><datalist id="addressList"><option value="123 Main Street"><option value="456 Oak Avenue"><option value="789 Pine Road"></datalist></fieldset><fieldset><legend>Order Details</legend><p>Coffee Type:</p><label><input type="radio" name="coffeeType" value="Latte" checked onchange="calculateTotal()"> Latte</label><label><input type="radio" name="coffeeType" value="Cappuccino" onchange="calculateTotal()"> Cappuccino</label><label><input type="radio" name="coffeeType" value="Espresso" onchange="calculateTotal()"> Espresso</label><label><input type="radio" name="coffeeType" value="Mocha" onchange="calculateTotal()"> Mocha</label><br><br><label for="size">Coffee Size:</label><select id="size" name="size" onchange="calculateTotal()"><option value="Small">Small</option><option value="Medium">Medium</option><option value="Large">Large</option></select><br><br><label for="quantity">Quantity:</label><input type="number" id="quantity" name="quantity" min="1" value="1" style="width: 50px;" oninput="calculateTotal()"><br><br><button type="button" onclick="calculateTotal()">Calculate Total (JS)</button><button type="submit">Submit Order</button></fieldset></form><p id="orderTotal" style="font-weight: bold; margin-top: 20px;">Total: $3.0</p></main><footer>Copyright &copy; 2016 JavaJam Coffee House<br><a href="mailto:s445000560@uqu.edu.sa">Shomookh Almalki</a></footer></div></body></html>
